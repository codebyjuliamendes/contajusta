# Deploy na Fly.io: `fly launch --no-deploy`, `fly volumes create contajusta_data --size 1`, `fly deploy`.
# SQLite exige uma única máquina com volume persistente; não escale horizontalmente.
app = 'contajusta'
primary_region = 'gru'

[build]

[env]
  NODE_ENV = 'production'
  DATABASE_PATH = '/data/contajusta.sqlite'
  TRUST_PROXY = '1'
  LOG_LEVEL = 'info'

[[mounts]]
  source = 'contajusta_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '3s'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
